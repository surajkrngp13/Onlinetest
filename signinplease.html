  const DB_NAME = "SecureVault";

 let index={};
  async function openDB() {
    if (dbInstance) return dbInstance;
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (evt) => {
        const db = evt.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = (evt) => {
        dbInstance = evt.target.result;
        resolve(dbInstance);
      };
      request.onerror = (evt) => reject(evt.target.error);
    });
  }

  async function storeToIndexedDB(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(value, key);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    });
  }

      req.onerror = (e) => reject(e.target.error);

  // ======================= CRYPTO (AES-GCM + PBKDF2) =======================

  const PBKDF2_ITERATIONS = 100000;

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

  async function encryptPayload(password, data) {
   const salt = crypto.getRandomValues(new Uint8Array(16));
const key = await deriveKey(password, salt);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(JSON.stringify(data));
    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
    const encryptedArray = new Uint8Array(encrypted);
    const base64Data = btoa(String.fromCharCode(...encryptedArray));
    return {
  salt: Array.from(salt),
  iv: Array.from(iv),
  data: base64Data
};
  }

async function decryptPayload(password, encryptedBlob) {

  if (!encryptedBlob.salt) {
    throw new Error("Old vault format detected. Please re-encrypt your data.");
  }

  const salt = new Uint8Array(encryptedBlob.salt);
  const key = await deriveKey(password, salt);

  const iv = new Uint8Array(encryptedBlob.iv);
  const cipherBytes = Uint8Array.from(atob(encryptedBlob.data), c => c.charCodeAt(0));

  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherBytes);

  return JSON.parse(new TextDecoder().decode(decrypted));
}

function deepcheckarray(oldData, newData) {
  let changes = {
    added: [],
    removed: [],
    updated: []
  };

  const oldKeys = Object.keys(oldData || {});
  const newKeys = Object.keys(newData || {});

  for (let key of newKeys) {
    if (!oldData.hasOwnProperty(key)) {
      changes.added.push({ key, value: newData[key] });
    } else if (JSON.stringify(oldData[key]) !== JSON.stringify(newData[key])) {
      changes.updated.push({
        key,
        old: oldData[key],
        new: newData[key]
      });
    }
  }

  for (let key of oldKeys) {
    if (!newData.hasOwnProperty(key)) {
      changes.removed.push({ key, value: oldData[key] });
    }
  }

  console.log("🔍 Changes:", changes);
  return changes;
}

async function firestroe(array) {
  console.log("🔥 Firestore Input:", array);

  try {
    let promises = array.map(async (yy) => {
      let parts = yy.key.split("_");

      let state = parts[0];
      let exam = parts[1];
      let level = parts[2];

      console.log("📦 Parsed:", state, exam, level);

      try {

        return {
          key: yy.key,
          data
        };

      } catch (err) {
        console.error("❌ Fetch failed:", yy.key, err);
        return null;
      }
    });

    let results = await Promise.all(promises);

    results = results.filter(x => x !== null);

    console.log("🔥 Firestore Result:", results);

    return results;

  } catch (err) {
    console.error("🔥 Firestore function error:", err);
    return [];
  }
}



function combineData(original, added, updated, removed) {
  let result = { ...(original || {}) };

  // 🔴 remove
  for (let i = 0; i < (removed || []).length; i++) {
    let key = removed[i].key;
    delete result[key];
  }

  // 🟡 update
  for (let i = 0; i < (updated || []).length; i++) {
    let item = updated[i];
    result[item.key] = item.new;
  }

  // 🟢 add
  for (let i = 0; i < (added || []).length; i++) {
    let item = added[i];
    result[item.key] = item.value;
  }

  return result;
}

      alert("An error occurred while accessing the vault");
    }
  };
 
  window.setpass = async function() {
    const user = auth.currentUser;
    if (!user) {
      console.error("No user logged in");
      alert("You must be logged in to set a profile password");
      return;
    }
     password = document.getElementById("profilepass").value;
    if (!password.trim()) {
      console.error("Password cannot be empty");
      alert("Please enter a password in the 'Enter profile password' field");
      return;
    }
    try {
      console.log("Fetching RTDB readOnlyData and Firestore graduation data...");
      
      const uuu = await needupdate([], []);
      console.log(uuu)
if (!uuu) {
  alert("No data found to create vault");
  return;
}


      //const combinedPayload = await buildCombinedVaultPayload(user.uid);
      const result = await encryptAndStoreVault("enc_data", password, uuu);
      if (result.success) {
        console.log("✅ Vault encrypted and stored successfully with profile password");
        alert("Profile password set and vault stored successfully!");
          
        sessionStorage.setItem("index", JSON.stringify(uuu));
         sessionStorage.setItem("pp", password);
        
       // let index1 = JSON.parse(sessionStorage.getItem("index"));
      
        // console.log(index1);
        const mainPassField = document.getElementById("pass");
        if (mainPassField) mainPassField.value = password;
        await updateProfileButtons(); // Refresh button visibility after storing
      } else {
        console.error("Encryption failed:", result.message);
        alert(`Failed to store vault: ${result.message}`);
      }
    } catch (err) {
      console.error("Unexpected error in setpass:", err);

    }
  };

  window.redirectToPrevious = function() {
    const redirectPage = sessionStorage.getItem("redirectAfterLogin");

   
    if (redirectPage) {
      sessionStorage.removeItem("redirectAfterLogin");
      window.location.href = redirectPage;
    } else {
      window.location.href = "index.html";
    }
  };

  // ======================= ADDITIONAL FUNCTIONS (phone, etc.) =======================
  async function getClientInfo() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      const ip = data.ip;
      const locRes = await fetch(`https://ip-api.com/json/${ip}?fields=status,country,city`);
      const locData = await locRes.json();
      const address = locData.status === 'success' ? `${locData.city}, ${locData.country}` : 'Unknown';
      return { ip, address };
    } catch (err) {
      console.warn("Could not fetch IP info:", err);
      return { ip: "unknown", address: "unknown" };
    }
  }

  async function saveUserData(user, phoneNumber) {
    const userRef = doc(db, "users", user.uid);
    const clientInfo = await getClientInfo();
    await setDoc(userRef, {
      phone: phoneNumber,
      ip: clientInfo.ip,
      address: clientInfo.address,
      lastLogin: new Date().toISOString()
    }, { merge: true });
  }

  async function checkAndHandlePhone(user) {
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);
    if (!snap.exists() || !snap.data().phone) {
      phoneBox.style.display = "block";
      infoEl.innerHTML = "Please add your phone number.";
    } else {
      infoEl.innerHTML = `📞 Phone: ${snap.data().phone}<br>📍 Last IP: ${snap.data().ip || 'N/A'}`;
      phoneBox.style.display = "none";
    }
  }

  let currentUser = null;

  savePhoneBtn.onclick = async () => {
    const phone = phoneInput.value.trim();
    if (!phone) {
      alert("Please enter a phone number.");
      return;
    }
    if (!currentUser) return;
    await saveUserData(currentUser, phone);
    alert("Phone number saved!");
    phoneBox.style.display = "none";
    infoEl.innerHTML = `📞 Phone: ${phone}<br>✅ Saved successfully.`;
  };

  // MAIN AUTH STATE HANDLER (manages login/logout UI + phone box + button visibility)
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;

    Plogindiv.style.display = "none";
    Clogdiv.style.display = "block";

    statusEl.innerText = `✅ Logged in as ${user.displayName || user.email}`;

    try {
      await checkAndHandlePhone(user);
      await updateProfileButtons();
    } catch (e) {
      console.log("post-login error:", e);
    }

  } else {
    currentUser = null;

    Plogindiv.style.display = "block";
    Clogdiv.style.display = "none";

    statusEl.innerText = "";
    if (infoEl) infoEl.innerHTML = "";

    phoneBox.style.display = "none";
    phoneInput.value = "";
  }
});
</script>
