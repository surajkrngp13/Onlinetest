<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hybrid User Panel</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/* ================= AUTH ================= */
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= RTDB ================= */
import {
  getDatabase,
  ref,
  get,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= FIRESTORE ================= */
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDbkK1inremaHQDtUrB-DX5CkvcAeihieY",
  authDomain: "quizdb-9db17.firebaseapp.com",
  projectId: "quizdb-9db17",
  storageBucket: "quizdb-9db17.firebasestorage.app",
  messagingSenderId: "1064062597943",
  appId: "1:1064062597943:web:be4d3f136a370e5181f8b2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const fs = getFirestore(app);
const provider = new GoogleAuthProvider();

/* ================= LOGIN ================= */
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("status").innerText = "Logged in: " + user.email;

    loadProfile(user.uid);
    loadReadOnly(user.uid);
    loadFirestoreData();

  } else {
    document.getElementById("status").innerText = "Not logged in";
  }
});

/* ================= SAVE PROFILE ================= */
window.saveProfile = async () => {
  const user = auth.currentUser;
  if (!user) return;

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  await set(ref(db, "users/" + user.uid + "/profile"), {
    name,
    email
  });

  loadProfile(user.uid);
};

/* ================= SAVE HIDDEN ================= */
window.saveHidden = async () => {
  const user = auth.currentUser;
  if (!user) return;

  const ip = document.getElementById("ip").value;
  const device = document.getElementById("device").value;

  await set(ref(db, "users/" + user.uid + "/hiddenDataU"), {
    ip,
    device,
    time: Date.now()
  });

  alert("Saved hidden data");
};

/* ================= LOAD PROFILE ================= */
async function loadProfile(uid) {
  const snap = await get(ref(db, "users/" + uid + "/profile"));

  if (snap.exists()) {
    document.getElementById("profileOut").innerText =
      JSON.stringify(snap.val(), null, 2);
  }
}

/* ================= LOAD RTDB READONLY ================= */
async function loadReadOnly(uid) {
  const snap = await get(ref(db, "users/" + uid + "/readOnlyData"));

  let html = "";

  if (snap.exists()) {
    snap.forEach(child => {
      const d = child.val();

      html += `
        <div style="border:1px solid #ccc; margin:10px; padding:10px;">
          <p><b>Value:</b> ${d.value || ""}</p>
          <p><b>Status:</b> ${d.status || ""}</p>
          <p><b>Expiry:</b> ${d.expiry || ""}</p>
        </div>
      `;
    });
  }

  document.getElementById("readonlyOut").innerHTML = html;
}

/* ================= FIRESTORE LOAD ================= */
async function loadFirestoreData() {
  const refDoc = doc(fs, "maindb", "bihar", "bssc", "graduationlevel");
  const snap = await getDoc(refDoc);

  if (snap.exists()) {
    document.getElementById("firestoreOut").innerText =
      JSON.stringify(snap.data(), null, 2);
  } else {
    document.getElementById("firestoreOut").innerText = "No data";
  }
}

</script>

<style>
body { font-family: Arial; padding: 20px; }
input { margin: 5px; padding: 8px; }
button { margin: 5px; padding: 10px; }
.box { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
pre { background:#111; color:#0f0; padding:10px; }
</style>

</head>

<body>

<h2>🔥 HYBRID USER DASHBOARD</h2>

<p id="status">Not logged in</p>

<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<hr>

<!-- PROFILE INPUT -->
<div class="box">
<h3>✍️ Profile Input</h3>
<input id="name" placeholder="Name"><br>
<input id="email" placeholder="Email"><br>
<button onclick="saveProfile()">Save Profile</button>
</div>

<!-- HIDDEN INPUT -->
<div class="box">
<h3>🔒 Hidden Data Input</h3>
<input id="ip" placeholder="IP"><br>
<input id="device" placeholder="Device"><br>
<button onclick="saveHidden()">Save Hidden</button>
</div>

<!-- PROFILE OUTPUT -->
<div class="box">
<h3>👤 Profile Output</h3>
<pre id="profileOut"></pre>
</div>

<!-- RTDB OUTPUT -->
<div class="box">
<h3>📦 RTDB ReadOnly Data</h3>
<div id="readonlyOut"></div>
</div>

<!-- FIRESTORE OUTPUT -->
<div class="box">
<h3>📚 Firestore Graduation Level</h3>
<pre id="firestoreOut"></pre>
</div>

</body>
</html>
