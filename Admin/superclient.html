<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hybrid User Panel</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbkK1inremaHQDtUrB-DX5CkvcAeihieY",
  authDomain: "quizdb-9db17.firebaseapp.com",
  projectId: "quizdb-9db17",
  storageBucket: "quizdb-9db17.firebasestorage.app",
  messagingSenderId: "1064062597943",
  appId: "1:1064062597943:web:be4d3f136a370e5181f8b2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

const provider = new GoogleAuthProvider();

let uid = null;

// 🔐 LOGIN
window.login = async () => {
  await signInWithPopup(auth, provider);
};

// 🔐 AUTH STATE
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  uid = user.uid;
  document.getElementById("uid").innerText = uid;

  try {
    const snap = await get(ref(rtdb, "rtdbStatus/" + uid));
    document.getElementById("rtdb").innerText =
      JSON.stringify(snap.val() || {}, null, 2);
  } catch (e) {
    document.getElementById("rtdb").innerText =
      "RTDB Error: " + e.message;
  }

  loadFirestore();
});

// 🔥 FIRESTORE LOAD
window.loadFirestore = async () => {
  try {
    const snap = await getDocs(collection(db, "maindb"));

    let data = [];

    snap.forEach(d => {
      data.push({ id: d.id, ...d.data() });
    });

    document.getElementById("firestore").innerText =
      JSON.stringify(data.length ? data : { message: "No Data Found" }, null, 2);

  } catch (e) {
    document.getElementById("firestore").innerText =
      "Firestore Error: " + e.message;
  }
};

// 🔄 REFRESH FIRESTORE
window.refreshFirestore = async () => {
  await loadFirestore();
};

// ✍️ WRITE FIRESTORE
window.writeFirestore = async () => {
  if (!uid) return alert("Login first");

  const value = document.getElementById("fsInput").value;

  await addDoc(collection(db, "maindb"), {
    data: value,
    uid: uid,
    time: Date.now()
  });

  alert("Firestore Data Sent");
  loadFirestore();
};

// ✍️ WRITE RTDB
window.writeRTDB = async () => {
  if (!uid) return alert("Login first");

  const value = document.getElementById("rtdbInput").value;

  await set(ref(rtdb, "users/" + uid + "/privateData/data"), {
    value: value,
    time: Date.now()
  });

  alert("RTDB Data Saved");
};

// 🔄 READ RTDB
window.readRTDB = async () => {
  if (!uid) return alert("Login first");

  const snap = await get(ref(rtdb, "users/" + uid));

  document.getElementById("rtdb").innerText =
    JSON.stringify(snap.val() || {}, null, 2);
};

</script>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  padding: 20px;
}
button {
  padding: 10px;
  margin: 5px;
}
textarea {
  width: 100%;
  height: 80px;
}
pre {
  background: #000;
  color: #0f0;
  padding: 10px;
  overflow: auto;
}
</style>

</head>

<body>

<h2>🔥 Hybrid User Panel (Firestore + RTDB)</h2>

<button onclick="login()">Login with Google</button>

<hr>

<h3>User UID</h3>
<div id="uid"></div>

<h3>RTDB Status</h3>
<pre id="rtdb"></pre>

<h3>Firestore Data (All)</h3>
<pre id="firestore"></pre>

<hr>

<h3>Write Firestore</h3>
<textarea id="fsInput"></textarea>
<button onclick="writeFirestore()">Send to Firestore</button>

<button onclick="refreshFirestore()">🔄 Refresh Firestore</button>

<h3>Write RTDB</h3>
<textarea id="rtdbInput"></textarea>
<button onclick="writeRTDB()">Send to RTDB</button>

<h3>Refresh RTDB</h3>
<button onclick="readRTDB()">Reload RTDB</button>

</body>
</html>
