<h2>Page 1</h2>

<div style="display:flex;justify-content:flex-end;padding:10px">
<div onclick="h()" style="display:flex;flex-direction:column;align-items:center;font-family:Arial;cursor:pointer">
<div style="width:50px;height:50px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)">
<span id="i" style="font-size:30px">👤</span>
<img id="p" style="width:100%;height:100%;object-fit:cover;display:none">
</div>
<div id="n" style="margin-top:6px;font-size:13px">Guest</div>
</div>
</div>
<script>
let s=0,n=document.getElementById("n"),p=document.getElementById("p"),i=document.getElementById("i");
function u(){try{let d=JSON.parse(sessionStorage.getItem("user"));if(d){s=1;n.innerText=d.name||"User";p.src=d.photo||"";p.style.display="block";i.style.display="none"}else{throw""}}catch(e){s=0;n.innerText="Guest";p.style.display="none";i.style.display="block"}}
u();
function h(){s?o():l()}
function l(){try{let d=JSON.parse(sessionStorage.getItem("user"));d?u():(sessionStorage.setItem("redirectAfterLogin",location.href),location='/signinplease.html')}catch(e){location='/signinplease.html'}}
function o(){sessionStorage.removeItem("user");u()}
</script>
