<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hybrid Secure Vault – Function‑Driven Core</title>
  <!-- No CSS: pure browser defaults, fully functional -->
</head>
<body>

<h2>🔐 HYBRID SECURE VAULT</h2>
<p id="status">Not logged in</p>

<button id="loginBtn">Login with Google</button>
<button id="logoutBtn">Logout</button>
<hr>

<h3>👤 Profile (RTDB)</h3>
<input id="name" placeholder="Full name">
<input id="email" placeholder="Email">
<button id="saveProfileBtn">Save Profile</button>

<h3>🕶️ Hidden Metadata</h3>
<input id="ip" placeholder="IP Address (simulated)">
<input id="device" placeholder="Device info">
<button id="saveHiddenBtn">Save Hidden</button>

<h3>🔐 Master Password + AES-GCM</h3>
<input type="password" id="pass" placeholder="Encryption/Decryption passphrase">
<button id="encryptBtn">Encrypt & Save (RTDB+Firestore)</button>
<button id="decryptBtn">Decrypt (manual)</button>
<p id="msg"></p>

<button id="deleteVaultBtn">Delete enc_data</button>

<button id="openPopupBtn" style="margin-top: 12px;">🔓 Open Vault Popup</button>

<!-- POPUP overlay (unstyled, functional) -->
<div id="popupOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#fff; color:#000; padding:24px; max-width:400px; margin:auto; border:2px solid #000; font-family:monospace;">
    <h3>🔐 ENCRYPTED VAULT</h3>
    <p>IndexedDB holds protected data.<br>Enter master password to unlock:</p>
    <input type="password" id="popupPass" style="width:90%; padding:8px;">
    <br><br>
    <button id="popupSubmitBtn">UNLOCK</button>
    <button id="popupCloseBtn">CLOSE</button>
    <div id="popupResult" style="margin-top:12px; font-size:0.9rem;"></div>
  </div>
</div>

<script type="module">
  // ------------------------------
  // 1. IMPORTS & FIREBASE SETUP    //  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
 
  // ------------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, get, set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {
    getFirestore, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbkK1inremaHQDtUrB-DX5CkvcAeihieY",
    authDomain: "quizdb-9db17.firebaseapp.com",
    projectId: "quizdb-9db17",
    storageBucket: "quizdb-9db17.firebasestorage.app",
    messagingSenderId: "1064062597943",
    appId: "1:1064062597943:web:be4d3f136a370e5181f8b2"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const rtdb = getDatabase(app);
  const firestore = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // ------------------------------------------------------
  // 2. CORE UTILITIES: IndexedDB (promise-based, payload/return)
  // ------------------------------------------------------
  const DB_NAME = "SecureVault";
  const DB_VERSION = 1;
  const STORE_NAME = "store";

  async function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (evt) => {
        const db = evt.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = (evt) => resolve(evt.target.result);
      request.onerror = (evt) => reject(evt.target.error);
    });
  }

  /** @returns {Promise<void>} */
  async function storeToIndexedDB(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(value, key);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    });
  }

  /** @returns {Promise<any>} */
  async function getFromIndexedDB(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result ?? null);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  /** @returns {Promise<void>} */
  async function deleteFromIndexedDB(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(key);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    });
  }

  /** @returns {Promise<boolean>} */
  async function existsInIndexedDB(key) {
    const value = await getFromIndexedDB(key);
    return value !== null && value !== undefined;
  }

  // ------------------------------------------------------
  // 3. CRYPTO CORE (AES-GCM + PBKDF2) – pure payload/return
  // ------------------------------------------------------
  const SALT = new TextEncoder().encode("static-salt");
  const PBKDF2_ITERATIONS = 100000;

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: SALT, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  /**
   * @param {any} data - Serializable payload
   * @param {string} password
   * @returns {Promise<{iv: number[], data: string}>}
   */
  async function encryptPayload(password, data) {
    const key = await deriveKey(password);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(JSON.stringify(data));
    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
    const encryptedArray = new Uint8Array(encrypted);
    const base64Data = btoa(String.fromCharCode(...encryptedArray));
    return { iv: Array.from(iv), data: base64Data };
  }

  /**
   * @param {string} password
   * @param {{iv: number[], data: string}} encryptedBlob
   * @returns {Promise<any>} original decrypted data
   */
  async function decryptPayload(password, encryptedBlob) {
    const key = await deriveKey(password);
    const iv = new Uint8Array(encryptedBlob.iv);
    const cipherBytes = Uint8Array.from(atob(encryptedBlob.data), c => c.charCodeAt(0));
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherBytes);
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  // ------------------------------------------------------
  // 4. FIREBASE DATA FETCHERS (pure payload/return)
  // ------------------------------------------------------
  /** @returns {Promise<object|null>} */
  async function fetchRTDBReadOnlyData(uid) {
    if (!uid) return null;
    const snapshot = await get(ref(rtdb, `users/${uid}/readOnlyData`));
    return snapshot.exists() ? snapshot.val() : null;
  }

  /** @returns {Promise<object|null>} */
  async function fetchFirestoreGraduationData() {
    const docRef = doc(firestore, "maindb", "bihar", "bssc", "graduationlevel");
    const snap = await getDoc(docRef);
    return snap.exists() ? snap.data() : null;
  }

  /** @returns {Promise<object>} combined payload for vault */
  async function buildCombinedVaultPayload(uid) {
    const [rtdbData, firestoreData] = await Promise.all([
      fetchRTDBReadOnlyData(uid),
      fetchFirestoreGraduationData()
    ]);
    return {
      rtdb: rtdbData,
      firestore: firestoreData,
      timestamp: Date.now()
    };
  }

  // ------------------------------------------------------
  // 5. VAULT CORE OPERATIONS (function‑based, payload+return)
  // ------------------------------------------------------
  /**
   * Encrypts a combined payload and stores it in IndexedDB.
   * @param {string} keyName - IndexedDB key
   * @param {string} password - master password
   * @param {object} combinedPayload - { rtdb, firestore, timestamp }
   * @returns {Promise<{success: boolean, message: string}>}
   */
  async function encryptAndStoreVault(keyName, password, combinedPayload) {
    if (!password || password.trim() === "") {
      return { success: false, message: "Password cannot be empty" };
    }
    try {
      const encrypted = await encryptPayload(password, combinedPayload);
      await storeToIndexedDB(keyName, encrypted);
      return { success: true, message: "Vault encrypted and stored successfully" };
    } catch (err) {
      console.error(err);
      return { success: false, message: `Encryption failed: ${err.message}` };
    }
  }

  /**
   * Retrieves and decrypts vault data from IndexedDB.
   * @param {string} keyName
   * @param {string} password
   * @returns {Promise<{success: boolean, data?: any, message?: string}>}
   */
  async function retrieveAndDecryptVault(keyName, password) {
    if (!password || password.trim() === "") {
      return { success: false, message: "Password required" };
    }
    const encryptedBlob = await getFromIndexedDB(keyName);
    if (!encryptedBlob) {
      return { success: false, message: "No encrypted vault found. Run 'Encrypt & Save' first." };
    }
    try {
      const decrypted = await decryptPayload(password, encryptedBlob);
      return { success: true, data: decrypted };
    } catch (err) {
      return { success: false, message: "Decryption failed: wrong password or corrupted data" };
    }
  }

  /** @returns {Promise<{success: boolean, message: string}>} */
  async function deleteVaultEntry(keyName) {
    try {
      const exists = await existsInIndexedDB(keyName);
      if (!exists) return { success: false, message: "No vault entry to delete" };
      await deleteFromIndexedDB(keyName);
      return { success: true, message: "Vault entry deleted successfully" };
    } catch (err) {
      return { success: false, message: `Delete failed: ${err.message}` };
    }
  }

  // ------------------------------------------------------
  // 6. PROFILE & HIDDEN METADATA (RTDB) – payload/return
  // ------------------------------------------------------
  /**
   * @param {string} uid
   * @param {{name: string, email: string}} profileData
   * @returns {Promise<{success: boolean, message: string}>}
   */
  async function saveUserProfileToRTDB(uid, profileData) {
    if (!uid) return { success: false, message: "User not authenticated" };
    try {
      await set(ref(rtdb, `users/${uid}/profile`), {
        ...profileData,
        updatedAt: Date.now()
      });
      return { success: true, message: "Profile saved" };
    } catch (err) {
      return { success: false, message: `Firebase error: ${err.message}` };
    }
  }

  /**
   * @param {string} uid
   * @param {{ip: string, device: string}} hiddenData
   * @returns {Promise<{success: boolean, message: string}>}
   */
  async function saveHiddenMetadataToRTDB(uid, hiddenData) {
    if (!uid) return { success: false, message: "User not authenticated" };
    try {
      await set(ref(rtdb, `users/${uid}/hiddenDataU`), {
        ...hiddenData,
        time: Date.now()
      });
      return { success: true, message: "Hidden metadata saved" };
    } catch (err) {
      return { success: false, message: `Firebase error: ${err.message}` };
    }
  }

  // ------------------------------------------------------
  // 7. AUTHENTICATION CORE (payload/return)
  // ------------------------------------------------------
  async function performGoogleLogin() {
    try {
      const result = await signInWithPopup(auth, googleProvider);
      return { success: true, user: result.user };
    } catch (err) {
      console.error(err);
      return { success: false, message: err.message };
    }
  }

  async function performLogout() {
    try {
      await signOut(auth);
      return { success: true };
    } catch (err) {
      return { success: false, message: err.message };
    }
  }

  // ------------------------------------------------------
  // 8. UI HELPERS & EVENT HANDLERS (bridge: DOM -> core -> DOM)
  // ------------------------------------------------------
  const statusEl = document.getElementById("status");
  const msgEl = document.getElementById("msg");

  function updateStatusText(user) {
    if (user) {
      statusEl.innerText = `✅ Logged in: ${user.email}`;
    } else {
      statusEl.innerText = "🔒 Not logged in";
    }
  }

  // Auth state listener (no auto-popup, just UI)
  onAuthStateChanged(auth, (user) => {
    updateStatusText(user);
  });

  // ---- Login handler ----
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const result = await performGoogleLogin();
    if (!result.success) {
      alert(`Login failed: ${result.message}`);
    }
  });

  // ---- Logout handler ----
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await performLogout();
  });

  // ---- Save Profile (payload from DOM) ----
  document.getElementById("saveProfileBtn").addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) {
      alert("Login required");
      return;
    }
    const nameInput = document.getElementById("name").value;
    const emailInput = document.getElementById("email").value;
    const result = await saveUserProfileToRTDB(user.uid, { name: nameInput, email: emailInput });
    alert(result.message);
  });

  // ---- Save Hidden Metadata ----
  document.getElementById("saveHiddenBtn").addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) {
      alert("Login required");
      return;
    }
    const ipVal = document.getElementById("ip").value;
    const deviceVal = document.getElementById("device").value;
    const result = await saveHiddenMetadataToRTDB(user.uid, { ip: ipVal, device: deviceVal });
    alert(result.message);
  });

  // ---- Encrypt & Save (RTDB + Firestore combined) ----
  document.getElementById("encryptBtn").addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) {
      msgEl.innerText = "❌ Login required before encryption";
      return;
    }
    const password = document.getElementById("pass").value;
    if (!password.trim()) {
      msgEl.innerText = "❌ Set master password first";
      return;
    }
    msgEl.innerText = "🔄 Fetching data from RTDB & Firestore...";
    try {
      const combinedPayload = await buildCombinedVaultPayload(user.uid);
      const result = await encryptAndStoreVault("enc_data", password, combinedPayload);
      if (result.success) {
        msgEl.innerText = "✅ Encrypted & saved to IndexedDB!";
      } else {
        msgEl.innerText = `❌ ${result.message}`;
      }
    } catch (err) {
      console.error(err);
      msgEl.innerText = "❌ Unexpected error during encryption.";
    }
  });

  // ---- Decrypt & show alert (manual) ----
  document.getElementById("decryptBtn").addEventListener("click", async () => {
    const password = document.getElementById("pass").value;
    if (!password.trim()) {
      msgEl.innerText = "⚠️ Enter password first!";
      return;
    }
    const result = await retrieveAndDecryptVault("enc_data", password);
    if (!result.success) {
      msgEl.innerText = `❌ ${result.message}`;
      return;
    }
    msgEl.innerText = "🔓 Decrypted! Check alert for details.";
    alert(`Decrypted Vault Data:\n\n📁 RTDB:\n${JSON.stringify(result.data.rtdb, null, 2)}\n\n🔥 FIRESTORE:\n${JSON.stringify(result.data.firestore, null, 2)}`);
  });

  // ---- Delete vault entry ----
  document.getElementById("deleteVaultBtn").addEventListener("click", async () => {
    const result = await deleteVaultEntry("enc_data");
    if (result.success) {
      msgEl.innerText = "🗑️ Vault entry deleted.";
      alert(result.message);
    } else {
      msgEl.innerText = `⚠️ ${result.message}`;
    }
  });

  // ------------------------------------------------------
  // 9. POPUP LOGIC (fully function‑based, payload/return)
  // ------------------------------------------------------
  const popupOverlay = document.getElementById("popupOverlay");
  const popupPassInput = document.getElementById("popupPass");
  const popupResultDiv = document.getElementById("popupResult");
  const popupSubmitBtn = document.getElementById("popupSubmitBtn");
  const popupCloseBtn = document.getElementById("popupCloseBtn");
  const openPopupBtn = document.getElementById("openPopupBtn");

  function openPopup() {
    if (!popupOverlay) return;
    popupOverlay.style.display = "flex";
    popupPassInput.value = "";
    popupResultDiv.innerHTML = "";
  }

  function closePopup() {
    if (popupOverlay) popupOverlay.style.display = "none";
  }

  /** Core popup unlock: uses retrieveAndDecryptVault, returns decrypted data or error */
  async function unlockVaultViaPopup(password, keyName = "enc_data") {
    return await retrieveAndDecryptVault(keyName, password);
  }

  // Handle submit inside popup
  async function onPopupSubmit() {
    const popupPassword = popupPassInput.value;
    if (!popupPassword.trim()) {
      popupResultDiv.innerHTML = "⚠️ Please enter master password";
      return;
    }
    popupResultDiv.innerHTML = "🔍 Unlocking vault...";
    const result = await unlockVaultViaPopup(popupPassword, "enc_data");
    if (!result.success) {
      popupResultDiv.innerHTML = `❌ ${result.message}`;
      return;
    }
    // success: display decrypted vault data
    const decryptedData = result.data;
    popupResultDiv.innerHTML = `
      <strong>✅ Vault unlocked!</strong><br>
      <details><summary>📁 RTDB Data</summary><pre style="background:#f0f0f0; padding:8px; overflow:auto;">${JSON.stringify(decryptedData.rtdb, null, 2)}</pre></details>
      <details><summary>🔥 Firestore Data</summary><pre style="background:#f0f0f0; padding:8px; overflow:auto;">${JSON.stringify(decryptedData.firestore, null, 2)}</pre></details>
      <button id="closePopupAfterSuccess" style="margin-top:10px;">Close</button>
    `;
    // Also sync master password field in main UI
    const mainPassField = document.getElementById("pass");
    if (mainPassField) mainPassField.value = popupPassword;
    msgEl.innerText = "🔓 Vault unlocked via popup!";
    
    const closeSuccessBtn = document.getElementById("closePopupAfterSuccess");
    if (closeSuccessBtn) closeSuccessBtn.onclick = () => closePopup();
  }

  // Open popup: check if vault exists before showing
  openPopupBtn.addEventListener("click", async () => {
    const vaultExists = await existsInIndexedDB("enc_data");
    if (!vaultExists) {
      alert("No encrypted vault found. Please use 'Encrypt & Save' first.");
      return;
    }
    openPopup();
  });

  popupSubmitBtn.addEventListener("click", onPopupSubmit);
  popupCloseBtn.addEventListener("click", closePopup);
  popupPassInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") onPopupSubmit();
  });

  // Close popup if background overlay clicked (optional)
  popupOverlay?.addEventListener("click", (e) => {
    if (e.target === popupOverlay) closePopup();
  });

  // ------------------------------------------------------
  // 10. EXTRA: ensure that any legacy references are clean
  //     all operations are now function‑based with payload/return
  // ------------------------------------------------------
  console.log("✅ Secure Vault initialized – all core operations use explicit payload/return pattern");
</script>
</body>
</html>
