<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Report Viewer Pro</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.box{
max-width:1000px;
margin:auto;
background:#111827;
padding:20px;
border-radius:12px;
}

.controls{
margin-bottom:15px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

button{
padding:8px 12px;
background:#22c55e;
border:none;
border-radius:8px;
cursor:pointer;
color:black;
font-weight:bold;
}

pre{
white-space:pre-wrap;
background:#000;
padding:15px;
border-radius:10px;
min-height:300px;
}

select{
padding:8px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2>📄 Report Viewer Pro</h2>

<div class="controls">

<button onclick="loadReport()">Load</button>

<select id="examFilter" onchange="applyFilter()">
<option value="ALL">All Exams</option>
</select>

<button onclick="sortByDate()">Sort by Date</button>

</div>

<pre id="out">Click Load</pre>

</div>

<script>

let db;
let allData = [];
let filteredData = [];
let reportText = "";

async function initDB(){
return new Promise((res,rej)=>{
const req = indexedDB.open("filesDB",2);

req.onsuccess = e=>{
db = e.target.result;
res();
};

req.onerror = rej;
});
}

function fromBase64(str){
return Uint8Array.from(atob(str), c=>c.charCodeAt(0));
}

function xorDecrypt(data, pass){
const key = new TextEncoder().encode(pass);
const out = new Uint8Array(data.length);

for(let i=0;i<data.length;i++){
out[i] = data[i] ^ key[i % key.length];
}

return new TextDecoder().decode(out);
}

async function loadReport(){

await initDB();

const tx = db.transaction("files","readonly");
const store = tx.objectStore("files");
const req = store.getAll();

req.onsuccess = ()=>{

const files = req.result;
const report = files.find(f=>f.name==="reportcard.txt");

if(!report){
document.getElementById("out").innerText="Not found";
return;
}

const pass = sessionStorage.getItem("reportPass") || prompt("Enter password");

try{

let raw = report.data;

// ===============================
// OLD FORMAT SUPPORT
// ===============================
if(typeof raw === "string" && raw.includes("\n") && raw.startsWith("ey") === false){

// OLD FORMAT (encrypted lines only)
const lines = raw.split("\n").filter(Boolean);

allData = lines.map((line, idx)=>({
examName: "Old Exam",
date: new Date().toISOString(),
data: line
}));

}else{

// NEW FORMAT (JSON array)
allData = JSON.parse(raw || "[]");

}

filteredData = [...allData];

fillExamDropdown();
render(pass);

}catch(e){
console.error(e);
document.getElementById("out").innerText="Decryption failed";
}

};

}

function fillExamDropdown(){

const sel = document.getElementById("examFilter");

const exams = [...new Set(allData.map(x=>x.examName || "Unknown"))];

sel.innerHTML = `<option value="ALL">All Exams</option>`;

exams.forEach(ex=>{
const opt = document.createElement("option");
opt.value = ex;
opt.innerText = ex;
sel.appendChild(opt);
});

}

function applyFilter(){

const val = document.getElementById("examFilter").value;

if(val === "ALL"){
filteredData = [...allData];
}else{
filteredData = allData.filter(x => (x.examName || "Unknown") === val);
}

render(sessionStorage.getItem("reportPass"));
}

function sortByDate(){
filteredData.sort((a,b)=> new Date(b.date) - new Date(a.date));
render(sessionStorage.getItem("reportPass"));
}

function render(pass){

let out = [];

for(let item of filteredData){

try{

const binary = fromBase64(item.data);
const text = xorDecrypt(binary, pass);

out.push(
`========================
📘 ${item.examName}
📅 ${new Date(item.date).toLocaleString()}

${text}
`
);

}catch(e){
console.warn("Skip item", e);
}

}

reportText = out.join("\n");

document.getElementById("out").innerText = reportText;

}

function downloadReport(){
const blob = new Blob([reportText],{type:"text/plain"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href=url;
a.download="reportcard.txt";
a.click();
}

</script>

</body>
</html>
