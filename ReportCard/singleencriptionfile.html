<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Single Encryption Migrator FIXED</title>

<style>
body{font-family:Arial;padding:20px;background:#f2f2f2}
button{padding:10px 15px;margin:5px}
input,textarea{padding:8px;width:250px}
pre{background:#000;color:#0f0;padding:15px;white-space:pre-wrap}
</style>
</head>
<body>

<h2>🔄 Encrypt Migration Tool (STABLE VERSION)</h2>

<input type="password" id="pass" placeholder="Password"><br><br>

<textarea id="inputText" rows="5" placeholder="New data if no old file found"></textarea><br><br>

<button id="btn" onclick="migrate()" disabled>Convert / Create Single File</button>

<pre id="out">Loading DB...</pre>

<script>
let db;

function openDB(){
return new Promise((resolve,reject)=>{
const req = indexedDB.open("QuizDB", 3);

req.onupgradeneeded = e=>{
let db = e.target.result;
if(!db.objectStoreNames.contains("files")){
db.createObjectStore("files",{keyPath:"id"});
}
};

req.onsuccess = e=>{
db = e.target.result;
resolve(db);
};

req.onerror = ()=>{
reject("DB error");
};
});
}

const dbReady = openDB();

dbReady.then(()=>{
document.getElementById("out").innerText="DB Ready ✔";
document.getElementById("btn").disabled=false;
}).catch(()=>{
document.getElementById("out").innerText="DB Failed ❌";
});

function fromBase64(b64){
let bin=atob(b64)
let arr=new Uint8Array(bin.length)
for(let i=0;i<bin.length;i++){
arr[i]=bin.charCodeAt(i)
}
return arr
}

function getKey(password,salt){
let enc=new TextEncoder().encode(password)

return crypto.subtle.importKey(
"raw",
enc,
"PBKDF2",
false,
["deriveKey"]
).then(keyMaterial=>{
return crypto.subtle.deriveKey(
{name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},
keyMaterial,
{name:"AES-GCM",length:256},
false,
["encrypt","decrypt"]
)
})
}

function decryptLine(line,password){
const parts=line.split("|")
if(parts.length<4) return Promise.resolve("")

const [,saltB64,ivB64,dataB64]=parts

let salt=fromBase64(saltB64)
let iv=fromBase64(ivB64)
let data=fromBase64(dataB64)

return getKey(password,salt).then(key=>{
return crypto.subtle.decrypt(
{name:"AES-GCM",iv},
key,
data
)
}).then(dec=>{
return new TextDecoder().decode(dec)
})
}

function encrypt(text,password){
let salt=crypto.getRandomValues(new Uint8Array(16))
let iv=crypto.getRandomValues(new Uint8Array(12))

return getKey(password,salt).then(key=>{
let data=new TextEncoder().encode(text)

return crypto.subtle.encrypt(
{name:"AES-GCM",iv},
key,
data
)
}).then(enc=>{
return Date.now()+"|"+
btoa(String.fromCharCode(...salt))+"|"+
btoa(String.fromCharCode(...iv))+"|"+
btoa(String.fromCharCode(...new Uint8Array(enc)))
})
}

async function migrate(){

await dbReady;

let pass=document.getElementById("pass").value
if(!pass){
alert("Enter password")
return
}

let tx=db.transaction("files","readonly")
let store=tx.objectStore("files")

let reqGet=store.get("y1.txt")

reqGet.onsuccess=async ()=>{

let data=reqGet.result
let fullText=""

if(data && data.content){

let lines=data.content.split("\n").filter(x=>x.trim()!=="")

for(let line of lines){
try{
fullText += await decryptLine(line,pass) + "\n"
}catch(e){
document.getElementById("out").innerText="❌ Wrong password or corrupted data"
return
}
}

}else{

let input=document.getElementById("inputText").value

if(!input){
document.getElementById("out").innerText="No old file found AND no input given"
return
}

fullText=input
}

let finalEncrypted = await encrypt(fullText.trim(),pass)

let tx2=db.transaction("files","readwrite")
let store2=tx2.objectStore("files")

store2.put({
id:"y1.txt",
content:finalEncrypted+"\n"
})

document.getElementById("out").innerText=
"✔ Done\nSaved as y1.txt"
}
}
</script>

</body>
</html>
