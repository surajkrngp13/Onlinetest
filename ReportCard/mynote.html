<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AES Vault (QuizDB)</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
textarea{width:100%;height:150px}
button{padding:10px;margin:5px}
pre{background:#000;color:#0f0;padding:10px}
</style>
</head>
<body>

<h2>🔐 AES Vault (Pipe Format)</h2>

<textarea id="text" placeholder="Enter text..."></textarea><br><br>

<input type="password" id="pass" placeholder="Password"><br><br>

<button onclick="saveText()">Encrypt & Save</button>
<button onclick="showText()">Decrypt & Show</button>

<hr>

<pre id="output"></pre>

<script>
let db;

// 🔹 Use your DB
const req = indexedDB.open("QuizDB", 2);

req.onupgradeneeded = e=>{
  db = e.target.result;

  if(!db.objectStoreNames.contains("files")){
    db.createObjectStore("files",{keyPath:"id"});
  }
};

req.onsuccess = e=>{
  db = e.target.result;
};

function ready(){
  if(!db){alert("DB not ready");return false;}
  return true;
}

// 🔹 Base64 helpers
function toBase64(bytes){
  let bin=""
  for(let i=0;i<bytes.length;i++){
    bin+=String.fromCharCode(bytes[i])
  }
  return btoa(bin)
}

function fromBase64(b64){
  let bin=atob(b64)
  let arr=new Uint8Array(bin.length)
  for(let i=0;i<bin.length;i++){
    arr[i]=bin.charCodeAt(i)
  }
  return arr
}

// 🔐 Key derive (PBKDF2)
async function getKey(password,salt){
  let enc=new TextEncoder().encode(password)

  let keyMaterial=await crypto.subtle.importKey(
    "raw",enc,"PBKDF2",false,["deriveKey"]
  )

  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},
    keyMaterial,
    {name:"AES-GCM",length:256},
    false,
    ["encrypt","decrypt"]
  )
}

// 🔐 Encrypt → pipe format
async function encrypt(text,password){
  let salt=crypto.getRandomValues(new Uint8Array(16))
  let iv=crypto.getRandomValues(new Uint8Array(12))

  let key=await getKey(password,salt)

  let data=new TextEncoder().encode(text)

  let enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data)

  return Date.now()+"|"+toBase64(salt)+"|"+toBase64(iv)+"|"+toBase64(new Uint8Array(enc))
}

// 🔓 Decrypt
async function decrypt(line,password){
  let parts=line.split("|")

  if(parts.length!==4) throw "Invalid format"

  let salt=fromBase64(parts[1])
  let iv=fromBase64(parts[2])
  let data=fromBase64(parts[3])

  let key=await getKey(password,salt)

  let dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data)

  return new TextDecoder().decode(dec)
}

// 💾 Save
async function saveText(){
  if(!ready())return;

  let text=document.getElementById("text").value
  let pass=document.getElementById("pass").value

  if(!text||!pass){alert("Fill both");return;}

  let line=await encrypt(text,pass)

  let tx=db.transaction("files","readwrite")
  let store=tx.objectStore("files")

  let g=store.get("mynote2.txt")

  g.onsuccess=()=>{
    let data=g.result

    if(!data){
      data={id:"mynote2.txt",content:""}
    }

    data.content+=line+"\n"

    store.put(data)
    alert("Saved ✅")
  }
}

// 📖 Show
async function showText(){
  if(!ready())return;

  let pass=document.getElementById("pass").value

  if(!pass){alert("Enter password");return;}

  let tx=db.transaction("files","readonly")
  let store=tx.objectStore("files")

  let g=store.get("mynote.txt")

  g.onsuccess=async ()=>{
    let data=g.result

    if(!data||!data.content){
      document.getElementById("output").innerText="No data"
      return
    }
    console.log(data.content)
    let ff=data.content
    let lines=ff.trim().split("\n")

    let res=""

    for(let line of lines){
      try{
        res+=await decrypt(line,pass)+"\n\n"
      }catch(e){
        res+="❌ Wrong password / corrupted\n"
      }
    }

    document.getElementById("output").innerText=res
  }
}
</script>

</body>
</html>
